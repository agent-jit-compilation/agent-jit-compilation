name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHON_DOTENV_DISABLED: "1"
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run agent-jit analyze --figure all --output runs/recorded
      - run: uv run agent-jit analyze-planner --output runs/recorded
      - run: uv run agent-jit analyze --figure 10 --normalize-non-parallel --output runs/normalized
      - run: uv run ruff check .
      - run: uv build --sdist

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra browser --extra webarena
      - run: uv run --extra browser patchright install --with-deps chromium
      - run: uv run agent-jit prepare-webarena --output .downloads/webarena
      - run: |
          mkdir -p .downloads/nltk
          chmod 700 .downloads/nltk
          uv run --extra webarena python -m nltk.downloader -d .downloads/nltk punkt_tab
      - run: uv run --extra browser --extra webarena pytest -q
